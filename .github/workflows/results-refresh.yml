# Secrets to add in repo Settings → Secrets and variables → Actions:
#   QUALTRICS_TOKEN, QUALTRICS_DATACENTER (yul1), SURVEY_TEEN (SV_6LFWjsZ51O8XInY), SURVEY_EDUCATOR (SV_bxUuSACfns11z5s),
#   SURVEY_LIBRARIAN (SV_9BO9iR0YKZ2lVie; library checkouts only)
name: Refresh results data
on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily (~2am Eastern). Use "0 * * * *" for hourly.
  workflow_dispatch:           # manual "Run workflow" button
permissions:
  contents: write
concurrency:
  group: results-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Aggregate
        env:
          QUALTRICS_TOKEN: ${{ secrets.QUALTRICS_TOKEN }}
          QUALTRICS_DATACENTER: ${{ secrets.QUALTRICS_DATACENTER }}
          SURVEY_TEEN: ${{ secrets.SURVEY_TEEN }}
          SURVEY_EDUCATOR: ${{ secrets.SURVEY_EDUCATOR }}
          SURVEY_LIBRARIAN: ${{ secrets.SURVEY_LIBRARIAN }}
          MIN_N: "0"   # no small-n suppression; only questions nobody answered are null
          # Optional repo variable (Settings → Secrets and variables → Actions → Variables): when the 3-point
          # screen-time question went live, e.g. 2026-09-25T14:00:00Z. Empty = read codes 1-3 as current.
          SCREEN_5PT_UNTIL: ${{ vars.SCREEN_5PT_UNTIL }}
          OUT: results/results-data.json
        run: python export/results_export.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add results/results-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh results data"
          # Someone may have pushed while the export ran: replay on top of it and retry.
          # Only this job writes results-data.json, so the rebase can't conflict.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 10
          done
          exit 1
